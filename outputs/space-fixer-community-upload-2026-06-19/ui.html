          </svg>
        <p>检查中文、英文、数字与标点之间的空格问题，并按中文排版规则修正。</p>
      </header>

      <main>
        <div class="toolbar">
          <select id="scope" title="扫描范围">
            <option value="page">当前页面</option>
            <option value="document">整个文件</option>
            <option value="selection">选中内容</option>
          </select>
          <button id="scan" class="primary">检查</button>
          <button id="fixAll" title="修复本次检查的全部问题，不受结果筛选影响" disabled>全部修复</button>
        </div>
        <div class="scan-option-groups">
          <div class="scan-option-group">
            <span class="scan-option-heading">修正规则</span>
            <div class="scan-options">
              <label>
                <input id="addMissingSpaces" type="checkbox" checked />
                <span class="scan-option-label">补充缺失空格</span>
              </label>
              <label class="optional-scan-option" title="可选的严格空格清理规则">
                <input
                  id="removeExtraSpaces"
                  type="checkbox"
                  aria-describedby="extraSpaceWarning"
                />
                <span class="scan-option-label">清理多余空格*</span>
              </label>
            </div>
            <button
              id="openSettings"
              class="settings-trigger"
              type="button"
              title="打开规则设置"
              aria-label="规则设置"
            >
              <!-- Lucide Settings icon -->
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <div id="extraSpaceWarning" class="extra-space-warning" role="note" hidden>
          * 可能会删除刻意保留的空格，建议逐条点击修复。
        </div>

        <section class="results-section">
          <div class="section-title">
            <strong>检查结果</strong>
            <span id="count" class="count">0 处</span>
          </div>
          <div id="resultStatus" class="result-status" role="status" aria-live="polite">
            <span id="resultStatusText">等待检查</span>
          </div>
          <div id="issueFilters" class="issue-filters" role="group" aria-label="问题类型筛选" hidden>
            <button class="issue-filter is-selected" type="button" data-filter="all">全部 0</button>
            <button class="issue-filter" type="button" data-filter="missing-space">缺少空格 0</button>
            <button class="issue-filter" type="button" data-filter="extra-space">多余空格 0</button>
            <button class="issue-filter" type="button" data-filter="term-format">
              术语格式 0
            </button>
          </div>
          <div id="issues" class="issues">
            <div class="empty">点击“检查”开始扫描。</div>
          </div>
        </section>

        <section class="whitelist-section">
          <button
            id="whitelistToggle"
            class="whitelist-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="whitelistContent"
          >
            <span class="whitelist-toggle-copy">
              <strong>术语规则（白名单）</strong>
              <span id="whitelistSummary" class="whitelist-summary">文件 0 条 · 个人 0 条</span>
            </span>
            <span class="whitelist-chevron" aria-hidden="true">
              <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false">
                <path d="M2.5 4.75L6 8.25L9.5 4.75"></path>
              </svg>
            </span>
          </button>
          <div id="whitelistContent" class="whitelist-content" hidden>
            <div class="whitelist-toolbar">
              <select id="whitelistTarget" title="术语规则范围">
                <option value="file">当前文件共享</option>
                <option value="personal">仅我使用</option>
              </select>
              <span id="whitelistScopeHint" class="whitelist-scope-hint">
                有编辑权限的成员可共享词条
              </span>
            </div>
            <textarea
              id="whitelist"
              spellcheck="false"
              placeholder="每行一个术语（示例未添加）：&#10;蓝心小V&#10;小V圈搜&#10;iQOO 智能双面夹5 Pro&#10;iPhone&#10;ChatGPT"
            ></textarea>
            <div class="whitelist-actions">
              <span id="saveStatus" class="count" hidden></span>
              <button id="clearWhitelist">清空当前</button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div id="allPreviewOverlay" class="modal-backdrop" hidden>
      <section class="modal preview-modal" role="dialog" aria-modal="true" aria-labelledby="allPreviewTitle">
        <h2 id="allPreviewTitle">全部修复预览</h2>
        <p id="allPreviewDescription"></p>
        <div id="allPreviewSummary" class="summary-grid"></div>
        <p class="preview-note">仅修复本次检查列出的问题，不改动手动换行。</p>
        <div class="preview-actions">
          <button id="cancelFixAll">取消</button>
          <button id="confirmFixAll" class="primary">确认全部修复</button>
        </div>
      </section>
    </div>
    <div id="clearWhitelistOverlay" class="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="clearWhitelistTitle">
        <h2 id="clearWhitelistTitle">清空术语规则？</h2>
        <p id="clearWhitelistDescription" class="confirm-description"></p>
        <div class="preview-actions">
          <button id="cancelClearWhitelist">取消</button>
          <button id="confirmClearWhitelist" class="danger">确认清空</button>
        </div>
      </section>
    </div>
    <div id="settingsOverlay" class="modal-backdrop" hidden>
      <section class="modal settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-title-row">
          <h2 id="settingsTitle">规则设置</h2>
          <button id="resetCleanupRules" class="settings-reset" type="button">
            恢复默认
          </button>
        </div>
        <div class="settings-sections">
          <section class="settings-section">
            <div class="settings-section-head">
              <strong>扫描设置</strong>
            </div>
            <label class="settings-option">
              <input id="ignoreHidden" type="checkbox" checked />
              <span>跳过隐藏图层</span>
            </label>
          </section>
          <section class="settings-section">
            <div class="settings-section-head">
              <strong>补充缺失空格</strong>
            </div>
            <div class="settings-options-inline">
              <label class="settings-option">
                <input id="addCjkLatinSpaces" type="checkbox" checked />
                <span>补充中文与英文/普通数字之间 1 个空格</span>
              </label>
              <input id="addCjkNumberSpaces" type="checkbox" checked hidden />
            </div>
            <div class="settings-divider" aria-hidden="true"></div>
            <label class="settings-option">
              <input id="excludeScriptSpaces" type="checkbox" checked />
              <span>排除角标</span>
            </label>
          </section>
          <section class="settings-section">
            <div class="settings-section-head">
              <strong>清理多余空格</strong>
            </div>
            <label class="settings-option">
              <input id="trimLineSpaces" type="checkbox" checked />
              <span>删除行首、行尾空格</span>
            </label>
            <div class="settings-divider" aria-hidden="true"></div>
            <label class="settings-option">
              <input id="removeCjkSpaces" type="checkbox" checked />
              <span>删除中文与中文之间的空格</span>
            </label>
            <label class="settings-option">
              <input id="removeCjkPunctuationSpaces" type="checkbox" checked />
              <span>删除中文与标点符号之间的空格</span>
            </label>
            <label class="settings-option">
              <input id="removeScriptSpaces" type="checkbox" checked />
              <span>删除角标左右空格</span>
            </label>
            <label class="settings-option">
              <input id="normalizeCjkAsciiSpaces" type="checkbox" checked />
              <span>中文与英文/数字之间多个空格压缩为 1 个</span>
            </label>
            <div class="settings-divider" aria-hidden="true"></div>
            <label class="settings-option">
              <input id="normalizeLatinSpaces" type="checkbox" checked />
              <span>英文与英文/数字之间多个空格压缩为 1 个</span>
            </label>
            <input id="normalizeLatinNumberSpaces" type="checkbox" checked hidden />
            <label class="settings-option">
              <input id="normalizeNumberSpaces" type="checkbox" checked />
              <span>数字与数字之间多个空格压缩为 1 个</span>
            </label>
            <label class="settings-option">
              <input id="removeNumberSpaces" type="checkbox" />
              <span>删除数字与数字之间空格（谨慎使用）</span>
            </label>
            <p class="settings-note">* 建议结合<strong>术语规则</strong>使用，仅适用于中文排版。</p>
          </section>
        </div>
        <div class="preview-actions">
          <button id="closeSettings" class="primary">完成</button>
        </div>
      </section>
    </div>
    <script>
      const scope = document.getElementById("scope");
      const scanButton = document.getElementById("scan");
      const fixAllButton = document.getElementById("fixAll");
      const openSettingsButton = document.getElementById("openSettings");
      const addMissingSpacesInput = document.getElementById("addMissingSpaces");
      const addCjkLatinSpacesInput = document.getElementById("addCjkLatinSpaces");
      const addCjkNumberSpacesInput = document.getElementById("addCjkNumberSpaces");
      const ignoreHiddenInput = document.getElementById("ignoreHidden");
      const excludeScriptSpacesInput = document.getElementById("excludeScriptSpaces");
      const removeExtraSpacesInput = document.getElementById("removeExtraSpaces");
      const trimLineSpacesInput = document.getElementById("trimLineSpaces");
      const removeCjkSpacesInput = document.getElementById("removeCjkSpaces");
      const removeCjkPunctuationSpacesInput =
        document.getElementById("removeCjkPunctuationSpaces");
      const removeScriptSpacesInput = document.getElementById("removeScriptSpaces");
      const normalizeLatinSpacesInput = document.getElementById("normalizeLatinSpaces");
      const normalizeCjkAsciiSpacesInput = document.getElementById("normalizeCjkAsciiSpaces");
      const normalizeLatinNumberSpacesInput =
        document.getElementById("normalizeLatinNumberSpaces");
      const normalizeNumberSpacesInput = document.getElementById("normalizeNumberSpaces");
      const removeNumberSpacesInput = document.getElementById("removeNumberSpaces");
      const resetCleanupRulesButton = document.getElementById("resetCleanupRules");
      const extraSpaceWarning = document.getElementById("extraSpaceWarning");
      const clearWhitelistButton = document.getElementById("clearWhitelist");
      const whitelistTarget = document.getElementById("whitelistTarget");
      const whitelistInput = document.getElementById("whitelist");
      const issuesContainer = document.getElementById("issues");
      const count = document.getElementById("count");
      const resultStatus = document.getElementById("resultStatus");
      const resultStatusText = document.getElementById("resultStatusText");
      const issueFilters = document.getElementById("issueFilters");
      const issueFilterButtons = Array.from(issueFilters.querySelectorAll(".issue-filter"));
      const saveStatus = document.getElementById("saveStatus");
      const whitelistScopeHint = document.getElementById("whitelistScopeHint");
      const whitelistToggle = document.getElementById("whitelistToggle");
      const whitelistContent = document.getElementById("whitelistContent");
      const whitelistSummary = document.getElementById("whitelistSummary");
      const allPreviewOverlay = document.getElementById("allPreviewOverlay");
      const allPreviewDescription = document.getElementById("allPreviewDescription");
      const allPreviewSummary = document.getElementById("allPreviewSummary");
      const cancelFixAllButton = document.getElementById("cancelFixAll");
      const confirmFixAllButton = document.getElementById("confirmFixAll");
      const clearWhitelistOverlay = document.getElementById("clearWhitelistOverlay");
      const clearWhitelistDescription = document.getElementById("clearWhitelistDescription");
      const cancelClearWhitelistButton = document.getElementById("cancelClearWhitelist");
      const confirmClearWhitelistButton = document.getElementById("confirmClearWhitelist");
      const settingsOverlay = document.getElementById("settingsOverlay");
      const closeSettingsButton = document.getElementById("closeSettings");
      let issues = [];
      let whitelistSaveTimer = null;
      let whitelistDirty = false;
      let whitelistSaveRequestId = 0;
      const latestWhitelistSaveRequestIds = {
        file: 0,
        personal: 0
      };
      let hasInitializedWhitelistVisibility = false;
      let activeIssueFilter = "all";
      let latestIssuesMessage = null;
      let isBusy = false;
      let resultsStale = false;
      let activeIgnoreIssueId = null;
      let pendingWhitelistAction = null;
      let fixAllPreviewTimer = null;
      let whitelists = {
        file: [],
        personal: []
      };
      let activeWhitelistTarget = "file";

      scanButton.onclick = () => {
        setBusy(true, "正在扫描文本图层...");
        parent.postMessage({ pluginMessage: getRequest("scan") }, "*");
      };

      fixAllButton.onclick = () => {
        if (resultsStale) return;
        setBusy(true, "正在生成全部修复预览...");
        window.clearTimeout(fixAllPreviewTimer);
        fixAllPreviewTimer = window.setTimeout(() => {
          setBusy(false);
          setResultStatus("failure", "修复预览生成超时，请重试。");
        }, 8000);
        parent.postMessage({ pluginMessage: getRequest("preview-all") }, "*");
      };

      for (const button of issueFilterButtons) {
        button.onclick = () => {
          activeIssueFilter = button.dataset.filter || "all";
          renderIssues(latestIssuesMessage);
        };
      }

      scope.addEventListener("change", () => {
        markResultsStale("扫描范围已更改，请重新检查。");
      });

      addCjkLatinSpacesInput.addEventListener("change", () => {
        addCjkNumberSpacesInput.checked = addCjkLatinSpacesInput.checked;
      });

      const detailedRuleInputs = [
        addCjkLatinSpacesInput,
        trimLineSpacesInput,
        removeCjkSpacesInput,
        removeCjkPunctuationSpacesInput,
        removeScriptSpacesInput,
        normalizeLatinSpacesInput,
        normalizeCjkAsciiSpacesInput,
        normalizeNumberSpacesInput,
        removeNumberSpacesInput
      ];

      for (const input of detailedRuleInputs) {
        input.addEventListener("change", () => {
          markResultsStale("检查选项已更改，请重新检查。");
        });
      }

      addMissingSpacesInput.addEventListener("change", handleSpacingRuleChange);

      removeExtraSpacesInput.addEventListener("change", () => {
        extraSpaceWarning.hidden = !removeExtraSpacesInput.checked;
        handleSpacingRuleChange();
      });

      normalizeLatinSpacesInput.addEventListener("change", () => {
        normalizeLatinNumberSpacesInput.checked = normalizeLatinSpacesInput.checked;
      });

      excludeScriptSpacesInput.addEventListener("change", () => {
        removeScriptSpacesInput.checked = excludeScriptSpacesInput.checked;
        syncDependentSettings();
        markResultsStale("检查选项已更改，请重新检查。");
      });

      removeScriptSpacesInput.addEventListener("change", () => {
        syncDependentSettings();
        markResultsStale("检查选项已更改，请重新检查。");
      });

      resetCleanupRulesButton.addEventListener("click", () => {
        addMissingSpacesInput.checked = true;
        removeExtraSpacesInput.checked = false;
        extraSpaceWarning.hidden = true;
        ignoreHiddenInput.checked = true;
        excludeScriptSpacesInput.checked = true;
        addCjkLatinSpacesInput.checked = true;
        addCjkNumberSpacesInput.checked = true;
        trimLineSpacesInput.checked = true;
        removeCjkSpacesInput.checked = true;
        normalizeCjkAsciiSpacesInput.checked = true;
        removeCjkPunctuationSpacesInput.checked = true;
        removeScriptSpacesInput.checked = true;
        normalizeLatinSpacesInput.checked = true;
        normalizeLatinNumberSpacesInput.checked = true;
        normalizeNumberSpacesInput.checked = true;
        removeNumberSpacesInput.checked = false;
        syncDependentSettings();
        markResultsStale("规则设置已恢复默认，请重新检查。");
      });

      ignoreHiddenInput.addEventListener("change", () => {
        markResultsStale("检查选项已更改，请重新检查。");
      });

      openSettingsButton.onclick = openSettings;
      closeSettingsButton.onclick = closeSettings;
      settingsOverlay.onclick = (event) => {
        if (event.target === settingsOverlay) closeSettings();
      };

      whitelistToggle.onclick = toggleWhitelist;

      function toggleWhitelist() {
        setWhitelistExpanded(!isWhitelistExpanded());
      }

      cancelFixAllButton.onclick = () => {
        closeFixAllPreview();
      };

      confirmFixAllButton.onclick = () => {
        closeFixAllPreview();
        parent.postMessage({ pluginMessage: getRequest("confirm-fix-all") }, "*");
      };

      function requestIssueFix(issue) {
        if (isBusy || resultsStale) return;
        setBusy(true, "正在修复当前问题...");
        const request = getRequest("fix-one");
        request.id = issue.id;
        parent.postMessage({ pluginMessage: request }, "*");
      }

      function openIssueIgnoreEditor(issue) {
        if (resultsStale || isBusy) return;
        activeIgnoreIssueId = activeIgnoreIssueId === issue.id ? null : issue.id;
        renderIssues(latestIssuesMessage);
        if (activeIgnoreIssueId) {
          window.requestAnimationFrame(() => {
            const input = issuesContainer.querySelector(".issue-ignore-input");
            if (input) {
              input.focus();
              input.select();
            }
          });
        }
      }

      function saveIssueIgnoreTerm(issue, input) {
        if (resultsStale || isBusy || !input) return;
        const term = input.value.trim();
        if (!term) {
          input.focus();
          return;
        }

        const target = whitelistTarget.value;
        const sourceItems = target === activeWhitelistTarget
          ? getWhitelistInputItems()
          : whitelists[target];
        const seenItems = new Set(sourceItems.map((item) => item.trim()));

        if (seenItems.has(term)) {
          activeIgnoreIssueId = null;
          renderIssues(latestIssuesMessage);
          setBusy(true, "术语已存在，正在重新检查...");
          parent.postMessage({ pluginMessage: getRequest("scan") }, "*");
          return;
        }

        const nextItems = [...sourceItems, term];

        if (target === whitelistTarget.value) {
          window.clearTimeout(whitelistSaveTimer);
          whitelistInput.value = nextItems.join("\n");
          whitelistDirty = false;
          updateClearWhitelistButton();
          setWhitelistSaveStatus("保存中");
        }

        const requestId = saveWhitelistItems(target, nextItems);
        pendingWhitelistAction = {
          type: "ignore",
          requestId,
          target,
          term
        };
        setWhitelistActionBusy(true);
        setBusy(true, "正在保存术语...");
      }

      function getIssueWhitelistTerm(issue) {
        if (issue.type === "missing-space") return (issue.pair || "").trim();
        if (issue.type === "term-format") return (issue.actual || issue.term || "").trim();
        if (isExtraSpaceIssueType(issue.type)) return (issue.actual || issue.beforeDifference || "").trim();
        return "";
      }

      function openFixAllPreview() {
        document.body.classList.add("modal-open");
        allPreviewOverlay.scrollTop = 0;
        allPreviewOverlay.hidden = false;
        cancelFixAllButton.focus();
        requestUiResize(true);
      }

      function closeFixAllPreview() {
        allPreviewOverlay.hidden = true;
        syncModalOpenState();
        requestUiResize(isWhitelistExpanded() || issues.length > 0);
      }

      function getRequest(type) {
        const shouldExcludeScriptSpaces = excludeScriptSpacesInput.checked;
        const shouldRemoveScriptSpaces =
          shouldExcludeScriptSpaces && removeScriptSpacesInput.checked;
        return {
          type,
          scope: scope.value,
          addMissingSpaces: addMissingSpacesInput.checked,
          addCjkLatinSpaces: addCjkLatinSpacesInput.checked,
          addCjkNumberSpaces: addCjkNumberSpacesInput.checked,
          excludeScriptSpaces: shouldExcludeScriptSpaces,
          addScriptSpaces: addMissingSpacesInput.checked && !shouldExcludeScriptSpaces,
          ignoreScripts: shouldExcludeScriptSpaces,
          keepScriptSpacesTight: shouldExcludeScriptSpaces,
          ignoreHidden: ignoreHiddenInput.checked,
          removeExtraSpaces: removeExtraSpacesInput.checked,
          trimLineSpaces: trimLineSpacesInput.checked,
          removeCjkSpaces: removeCjkSpacesInput.checked,
          removeCjkPunctuationSpaces: removeCjkPunctuationSpacesInput.checked,
          removeScriptSpaces: shouldRemoveScriptSpaces,
          normalizeLatinSpaces: normalizeLatinSpacesInput.checked,
          normalizeCjkAsciiSpaces: normalizeCjkAsciiSpacesInput.checked,
          normalizeLatinNumberSpaces: normalizeLatinNumberSpacesInput.checked,
          normalizeNumberSpaces: normalizeNumberSpacesInput.checked,
          removeNumberSpaces: removeNumberSpacesInput.checked
        };
      }

      function isWhitelistExpanded() {
        return whitelistToggle.getAttribute("aria-expanded") === "true";
      }

      function setWhitelistExpanded(isExpanded) {
        whitelistToggle.setAttribute("aria-expanded", String(isExpanded));
        if (isExpanded) {
          requestUiResize(true);
          window.requestAnimationFrame(() => {
            whitelistContent.hidden = false;
          });
          return;
        }
        whitelistContent.hidden = true;
        requestUiResize(issues.length > 0);
      }

      function requestUiResize(expanded) {
        const expandedHeight =
          expanded && isWhitelistExpanded() && issues.length === 0
            ? "whitelist-empty"
            : "workspace";
        parent.postMessage({
          pluginMessage: {
            type: "resize-ui",
            expanded,
            expandedHeight
          }
        }, "*");
      }

      function setBusy(nextBusy, message) {
        isBusy = nextBusy;
        updateScanAvailability();
        fixAllButton.disabled = nextBusy || resultsStale || issues.length === 0;
        scope.disabled = nextBusy;
        addMissingSpacesInput.disabled = nextBusy;
        openSettingsButton.disabled = nextBusy;
        ignoreHiddenInput.disabled = nextBusy;
        removeExtraSpacesInput.disabled = nextBusy;
        syncDependentSettings();

        if (nextBusy) {
          setResultStatus("loading", message || "处理中...");
        }
      }

      function hasActiveSpacingRule() {
        return addMissingSpacesInput.checked || removeExtraSpacesInput.checked;
      }

      function updateScanAvailability() {
        const hasRule = hasActiveSpacingRule();
        scanButton.disabled = isBusy || !hasRule;
        scanButton.title = hasRule ? "" : "请至少选择一项修正规则";
      }

      function handleSpacingRuleChange() {
        syncDependentSettings();
        updateScanAvailability();
        markResultsStale("检查选项已更改，请重新检查。");
        if (!hasActiveSpacingRule()) {
          setResultStatus("warning", "请至少选择一项修正规则。");
        } else if (!latestIssuesMessage) {
          setResultStatus("", "等待检查");
        }
      }

      function syncDependentSettings() {
        if (!excludeScriptSpacesInput.checked) {
          removeScriptSpacesInput.checked = false;
        }
        const missingInputs = [
          addCjkLatinSpacesInput,
          excludeScriptSpacesInput
        ];
        const cleanupInputs = [
          trimLineSpacesInput,
          removeCjkSpacesInput,
          removeCjkPunctuationSpacesInput,
          normalizeLatinSpacesInput,
          normalizeCjkAsciiSpacesInput,
          normalizeNumberSpacesInput,
          removeNumberSpacesInput
        ];
        setSettingsGroupDisabled(
          missingInputs,
          isBusy || !addMissingSpacesInput.checked
        );
        setSettingsGroupDisabled(
          cleanupInputs,
          isBusy || !removeExtraSpacesInput.checked
        );
        excludeScriptSpacesInput.disabled =
          isBusy || !addMissingSpacesInput.checked;
        excludeScriptSpacesInput.parentElement.classList.toggle(
          "is-disabled",
          excludeScriptSpacesInput.disabled
        );
        removeScriptSpacesInput.disabled =
          isBusy || !removeExtraSpacesInput.checked || !excludeScriptSpacesInput.checked;
        removeScriptSpacesInput.parentElement.classList.toggle(
          "is-disabled",
          removeScriptSpacesInput.disabled
        );
        resetCleanupRulesButton.disabled = isBusy;
      }

      function setSettingsGroupDisabled(inputs, disabled) {
        for (const input of inputs) {
          input.disabled = disabled;
          input.parentElement.classList.toggle("is-disabled", disabled);
        }
      }

      function openSettings() {
        syncDependentSettings();
        settingsOverlay.hidden = false;
        document.body.classList.add("modal-open");
        closeSettingsButton.focus();
        requestUiResize(true);
      }

      function closeSettings() {
        settingsOverlay.hidden = true;
        syncModalOpenState();
        requestUiResize(isWhitelistExpanded() || issues.length > 0);
      }

      function syncModalOpenState() {
        const hasOpenModal =
          !allPreviewOverlay.hidden ||
          !clearWhitelistOverlay.hidden ||
          !settingsOverlay.hidden;
        document.body.classList.toggle("modal-open", hasOpenModal);
      }

      function markResultsStale(message) {
        if (!issues.length || !latestIssuesMessage) return;
        resultsStale = true;
        fixAllButton.title = "请先按当前条件重新检查";
        renderIssues(latestIssuesMessage);
        setResultStatus("warning", message);
      }

      function setResultStatus(status, message) {
        resultStatus.className = "result-status";
        resultStatus.innerHTML = "";

        if (status === "loading") {
          const spinner = document.createElement("span");
          spinner.className = "status-spinner";
          resultStatus.appendChild(spinner);
        } else if (status) {
          resultStatus.classList.add(`is-${status}`);
        }

        resultStatusText.textContent = message;
        resultStatus.appendChild(resultStatusText);
      }

      whitelistInput.addEventListener("input", () => {
        updateClearWhitelistButton();
        whitelistDirty = true;
        setWhitelistSaveStatus("正在输入...");
        window.clearTimeout(whitelistSaveTimer);
        whitelistSaveTimer = window.setTimeout(saveWhitelist, 500);
      });

      whitelistInput.addEventListener("blur", () => {
        if (!whitelistDirty) {
          updateClearWhitelistButton();
          return;
        }
        window.clearTimeout(whitelistSaveTimer);
        saveWhitelist();
      });

      whitelistTarget.addEventListener("change", () => {
        window.clearTimeout(whitelistSaveTimer);
        if (whitelistDirty) saveWhitelist(activeWhitelistTarget);
        activeWhitelistTarget = whitelistTarget.value;
        renderWhitelist();
      });

      clearWhitelistButton.onclick = () => {
        const items = getWhitelistInputItems();
        if (!items.length) return;
        const target = whitelistTarget.value;
        const targetLabel = getWhitelistTargetLabel(target);
        clearWhitelistDescription.textContent = target === "file"
          ? `将删除${targetLabel}中的 ${items.length} 个术语，并影响同一文件中有编辑权限的成员。`
          : `将删除${targetLabel}中的 ${items.length} 个术语。`;
        clearWhitelistOverlay.hidden = false;
        document.body.classList.add("modal-open");
        confirmClearWhitelistButton.focus();
      };

      cancelClearWhitelistButton.onclick = closeClearWhitelistConfirm;

      clearWhitelistOverlay.onclick = (event) => {
        if (event.target === clearWhitelistOverlay) closeClearWhitelistConfirm();
      };

      confirmClearWhitelistButton.onclick = () => {
        const target = whitelistTarget.value;
        const items = getWhitelistInputItems();
        closeClearWhitelistConfirm();
        if (!items.length) return;

        window.clearTimeout(whitelistSaveTimer);
        whitelistDirty = false;
        whitelistInput.value = "";
        setWhitelistSaveStatus("清空中");
        const requestId = createWhitelistRequestId(target);
        pendingWhitelistAction = {
          type: "clear",
          requestId,
          target,
          items
        };
        setWhitelistActionBusy(true);
        parent.postMessage({
          pluginMessage: {
            type: "clear-whitelist",
            requestId,
            target
          }
        }, "*");
      };

      function closeClearWhitelistConfirm() {
        clearWhitelistOverlay.hidden = true;
        syncModalOpenState();
      }

      function getWhitelistInputItems() {
        const uniqueItems = [];
        const seenItems = new Set();
        const items = whitelistInput.value
          .split(/\r?\n/)
          .map((item) => item.trim())
          .filter((item) => item.length > 0);

        for (const item of items) {
          if (seenItems.has(item)) continue;
          seenItems.add(item);
          uniqueItems.push(item);
        }

        return uniqueItems;
      }

      function getWhitelistTargetLabel(target) {
        return target === "file" ? "当前文件共享术语规则" : "个人术语规则";
      }

      function setWhitelistActionBusy(isActionBusy) {
        whitelistTarget.disabled = isActionBusy;
        whitelistInput.disabled = isActionBusy;
        clearWhitelistButton.disabled = isActionBusy || getWhitelistInputItems().length === 0;
      }

      function updateClearWhitelistButton() {
        clearWhitelistButton.disabled =
          Boolean(pendingWhitelistAction) || getWhitelistInputItems().length === 0;
      }

      function saveWhitelist(target = activeWhitelistTarget) {
        if (!whitelistDirty) return;
        whitelistDirty = false;
        setWhitelistSaveStatus("保存中");
        saveWhitelistItems(target, getWhitelistInputItems());
      }

      function saveWhitelistItems(target, items) {
        const requestId = createWhitelistRequestId(target);
        parent.postMessage({
          pluginMessage: {
            type: "save-whitelist",
            requestId,
            target,
            items
          }
        }, "*");
        return requestId;
      }

      function createWhitelistRequestId(target) {
        const requestId = ++whitelistSaveRequestId;
        latestWhitelistSaveRequestIds[target] = requestId;
        return requestId;
      }

      function updateWhitelists(message) {
        if (Array.isArray(message.fileWhitelist)) whitelists.file = message.fileWhitelist;
        if (Array.isArray(message.personalWhitelist)) whitelists.personal = message.personalWhitelist;
      }

      function renderWhitelist() {
        const target = whitelistTarget.value;
        activeWhitelistTarget = target;
        whitelistInput.value = whitelists[target].join("\n");
        whitelistInput.disabled = false;
        whitelistDirty = false;
        updateClearWhitelistButton();
        updateWhitelistSaveStatus(target);
        renderWhitelistSummary();
        initializeWhitelistVisibility();
      }

      function updateWhitelistSaveStatus(target) {
        clearWhitelistSaveStatus();
        whitelistScopeHint.textContent = target === "file"
          ? "有编辑权限的成员可共享词条"
          : "仅保存在本机";
        saveStatus.removeAttribute("title");
      }

      function setWhitelistSaveStatus(message) {
        saveStatus.textContent = message;
        saveStatus.hidden = false;
      }

      function clearWhitelistSaveStatus() {
        saveStatus.textContent = "";
        saveStatus.hidden = true;
      }

      function renderWhitelistSummary() {
        whitelistSummary.textContent = `文件 ${whitelists.file.length} 条 · 个人 ${whitelists.personal.length} 条`;
      }

      function initializeWhitelistVisibility() {
        if (hasInitializedWhitelistVisibility) return;
        hasInitializedWhitelistVisibility = true;
        const hasAnyTerms = whitelists.file.length + whitelists.personal.length > 0;
        if (!hasAnyTerms) setWhitelistExpanded(true);
      }

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === "state") {
          updateWhitelists(message);
          renderWhitelist();
        }

        if (message.type === "issues") {
          issues = message.issues;
          latestIssuesMessage = message;
          resultsStale = false;
          fixAllButton.title = "修复本次检查的全部问题，不受结果筛选影响";
          setBusy(false);
          renderIssues(message);
        }

        if (message.type === "fix-all-preview") {
          window.clearTimeout(fixAllPreviewTimer);
          setBusy(false);
          try {
            renderFixAllPreview(message.preview);
          } catch (error) {
            closeFixAllPreview();
            setResultStatus("failure", "修复预览显示失败，请重试。");
          }
        }

        if (message.type === "fix-all-preview-failed") {
          window.clearTimeout(fixAllPreviewTimer);
          setBusy(false);
          closeFixAllPreview();
          setResultStatus("failure", message.message || "无法生成修复预览，请重试。");
        }

        if (message.type === "whitelist-saved") {
          const target = message.target === "personal" ? "personal" : "file";
          if (message.requestId !== latestWhitelistSaveRequestIds[target]) return;
          if (target === "file" && Array.isArray(message.fileWhitelist)) {
            whitelists.file = message.fileWhitelist;
          }
          if (target === "personal" && Array.isArray(message.personalWhitelist)) {
            whitelists.personal = message.personalWhitelist;
          }
          renderWhitelistSummary();
          let completedWhitelistAction = null;
          if (
            pendingWhitelistAction &&
            pendingWhitelistAction.requestId === message.requestId
          ) {
            completedWhitelistAction = pendingWhitelistAction;
            pendingWhitelistAction = null;
            setWhitelistActionBusy(false);
          }
          if (message.target === whitelistTarget.value) {
            updateWhitelistSaveStatus(message.target);
            setWhitelistSaveStatus("已保存");
          }
          if (completedWhitelistAction && completedWhitelistAction.type === "ignore") {
            activeIgnoreIssueId = null;
            renderIssues(latestIssuesMessage);
            setBusy(true, `已忽略「${completedWhitelistAction.term}」，正在重新检查...`);
            parent.postMessage({ pluginMessage: getRequest("scan") }, "*");
            return;
          }
          markResultsStale("术语规则已更新，请重新检查。");
        }

        if (message.type === "whitelist-save-failed") {
          const target = message.target === "personal" ? "personal" : "file";
          if (message.requestId !== latestWhitelistSaveRequestIds[target]) return;
          if (
            pendingWhitelistAction &&
            pendingWhitelistAction.requestId === message.requestId
          ) {
            const failedAction = pendingWhitelistAction;
            if (
              failedAction.type === "clear" &&
              failedAction.target === whitelistTarget.value
            ) {
              whitelistInput.value = failedAction.items.join("\n");
            }
            pendingWhitelistAction = null;
            setWhitelistActionBusy(false);
            whitelistDirty = false;
            if (failedAction.type === "ignore") {
              if (failedAction.target === whitelistTarget.value) {
                whitelistInput.value = whitelists[failedAction.target].join("\n");
                updateClearWhitelistButton();
              }
              setBusy(false);
              setResultStatus("failure", "术语保存失败，请重试。");
            }
          } else {
            whitelistDirty = true;
          }
          setWhitelistSaveStatus("保存失败");
        }
      };

      function renderIssues(message) {
        ensureActiveIssueFilter();
        const visibleIssues = getVisibleIssues();
        const groups = groupIssuesByNode(visibleIssues);
        const allGroups = groupIssuesByNode(issues);
        document.body.classList.toggle("has-results", issues.length > 0);
        count.textContent = visibleIssues.length
          ? activeIssueFilter === "all"
            ? `${visibleIssues.length} 处 · ${groups.length} 个图层`
            : `${visibleIssues.length} / ${issues.length} 处 · ${groups.length} 个图层`
          : "0 处";
        issuesContainer.innerHTML = "";
        issuesContainer.classList.toggle("is-stale", resultsStale);
        fixAllButton.disabled = isBusy || resultsStale || issues.length === 0;
        renderIssueFilters();

        if (resultsStale) {
          setResultStatus("warning", "检查条件已更改，请重新检查。");
        } else if (message && message.status === "failure") {
          setResultStatus("failure", message.message || "操作失败，请重试。");
        } else if (message && message.emptyReason === "no-selection") {
          setResultStatus("warning", "未选择内容，请先在画布中选择文本图层或容器。");
        } else if (message && message.message) {
          setResultStatus("success", message.message);
        } else if (message && message.status === "success" && issues.length) {
          setResultStatus(
            "success",
            `已扫描 ${message.scannedNodeCount} 个文本图层`
          );
        } else if (message && message.status === "success") {
          setResultStatus(
            "success",
            `检查完成：扫描 ${message.scannedNodeCount} 个文本图层，未发现问题。`
          );
        }

        if (!issues.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          if (message && message.status === "failure") {
            empty.textContent = "检查未完成，请重试。";
          } else if (message && message.emptyReason === "no-selection") {
            empty.textContent = "选择内容后再次点击“检查”。";
          } else {
            empty.textContent = "当前扫描范围没有发现间距问题。";
          }
          issuesContainer.appendChild(empty);
          requestUiResize(isWhitelistExpanded());
          return;
        }

          if (!visibleIssues.length) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = activeIssueFilter === "missing-space"
              ? "没有缺少空格的问题。"
              : activeIssueFilter === "extra-space"
                ? "没有多余空格问题。"
              : "没有术语格式问题。";
            issuesContainer.appendChild(empty);
            requestUiResize(true);
            return;
        }

        for (const group of groups) {
          const item = document.createElement("article");
          item.className = "issue";

          const head = document.createElement("div");
          head.className = "issue-head";

          const node = document.createElement("div");
          node.className = "node";

          if (group.pageName) {
            const pageName = document.createElement("span");
            pageName.className = "node-page";
            pageName.textContent = group.pageName;

            const separator = document.createElement("span");
            separator.className = "node-separator";
            separator.textContent = "·";

            node.append(pageName, separator);
          }

          const layerName = document.createElement("span");
          layerName.className = "node-layer";
          layerName.textContent = group.nodeName;
          node.appendChild(layerName);

          const groupCount = document.createElement("span");
          groupCount.className = "group-count";
          const allGroup = allGroups.find((item) => item.nodeId === group.nodeId);
          groupCount.textContent = activeIssueFilter === "all" || !allGroup
            ? `${group.issues.length} 处`
            : `${group.issues.length} / ${allGroup.issues.length} 处`;

          head.append(node, groupCount);
          item.appendChild(head);

          for (const issue of group.issues) {
            const row = document.createElement("div");
            row.className = "issue-row";

            const copy = document.createElement("div");
            copy.className = "issue-copy";

            const meta = document.createElement("div");
            meta.className = "issue-meta";

            const kind = document.createElement("span");
            kind.className = "issue-kind";
            kind.textContent = getIssueKindLabel(issue.type);

            const pair = document.createElement("span");
            pair.className = "pair";
            appendVisibleSpaces(pair, issue.beforeDifference || issue.pair);

            const arrow = document.createElement("span");
            arrow.className = "difference-arrow";
            arrow.textContent = "→";

            const after = document.createElement("span");
            after.className = "pair difference-after";
            appendVisibleSpaces(after, issue.afterDifference || issue.pair);

            const excerpt = document.createElement("div");
            excerpt.className = "excerpt";
            excerpt.textContent = issue.excerpt;
            excerpt.title = issue.excerpt;

            const actions = document.createElement("div");
            actions.className = "issue-actions";

            const select = document.createElement("button");
            select.className = "issue-action-locate";
            select.textContent = "定位";
            select.disabled = isBusy;
            select.onclick = () => {
              if (isBusy) return;
              parent.postMessage({
                pluginMessage: {
                  type: "select-issue",
                  id: issue.id
                }
              }, "*");
            };

            const addTerm = document.createElement("button");
            addTerm.className = "issue-action-term";
            addTerm.textContent = "忽略";
            addTerm.disabled = isBusy || resultsStale || !getIssueWhitelistTerm(issue);
            if (resultsStale) addTerm.title = "请先按当前条件重新检查";
            addTerm.onclick = () => openIssueIgnoreEditor(issue);

            const fix = document.createElement("button");
            fix.className = "issue-action-fix";
            fix.textContent = "修复";
            fix.disabled = isBusy || resultsStale;
            if (resultsStale) fix.title = "请先按当前条件重新检查";
            fix.onclick = () => requestIssueFix(issue);

            meta.append(kind, pair, arrow, after);
            copy.append(meta, excerpt);
            actions.append(addTerm, select, fix);
            row.append(copy, actions);
            item.appendChild(row);

            if (activeIgnoreIssueId === issue.id) {
              const editor = document.createElement("div");
              editor.className = "issue-ignore-editor";

              const input = document.createElement("input");
              input.className = "issue-ignore-input";
              input.type = "text";
              input.value = getIssueWhitelistTerm(issue);
              input.placeholder = "输入要忽略的完整术语";
              input.setAttribute("aria-label", "要加入白名单的术语");

              const cancel = document.createElement("button");
              cancel.className = "issue-ignore-cancel";
              cancel.type = "button";
              cancel.textContent = "取消";
              cancel.onclick = () => {
                activeIgnoreIssueId = null;
                renderIssues(latestIssuesMessage);
              };

              const save = document.createElement("button");
              save.className = "issue-ignore-save primary";
              save.type = "button";
              save.textContent = "保存并重新检查";
              save.onclick = () => saveIssueIgnoreTerm(issue, input);

              input.addEventListener("keydown", (event) => {
                if (event.key === "Enter") saveIssueIgnoreTerm(issue, input);
                if (event.key === "Escape") {
                  activeIgnoreIssueId = null;
                  renderIssues(latestIssuesMessage);
                }
              });

              editor.append(input, cancel, save);
              item.appendChild(editor);
            }
          }

          issuesContainer.appendChild(item);
        }

        requestUiResize(true);
      }

      function getVisibleIssues() {
        if (activeIssueFilter === "all") return issues;
        if (activeIssueFilter === "extra-space") {
          return issues.filter((issue) => isExtraSpaceIssueType(issue.type));
        }
        return issues.filter((issue) => issue.type === activeIssueFilter);
      }

      function ensureActiveIssueFilter() {
        if (activeIssueFilter === "all") return;
        const hasMatchingIssue = activeIssueFilter === "extra-space"
          ? issues.some((issue) => isExtraSpaceIssueType(issue.type))
          : issues.some((issue) => issue.type === activeIssueFilter);
        if (!hasMatchingIssue) activeIssueFilter = "all";
      }

      function renderIssueFilters() {
        const missingCount = issues.filter((issue) => issue.type === "missing-space").length;
        const extraCount = issues.filter((issue) => isExtraSpaceIssueType(issue.type)).length;
        const termFormatCount = issues.filter((issue) => issue.type === "term-format").length;
        const labels = {
          all: `全部 ${issues.length}`,
          "missing-space": `缺少空格 ${missingCount}`,
          "extra-space": `多余空格 ${extraCount}`
        };

        issueFilters.hidden = issues.length === 0;

        for (const button of issueFilterButtons) {
          const filter = button.dataset.filter || "all";
          if (filter === "term-format") {
            button.textContent = `术语格式 ${termFormatCount}`;
          } else {
            button.textContent = labels[filter];
          }
          button.classList.toggle("is-selected", filter === activeIssueFilter);
          button.setAttribute("aria-pressed", String(filter === activeIssueFilter));
          button.disabled = filter === "missing-space"
            ? missingCount === 0
            : filter === "extra-space"
              ? extraCount === 0
            : filter === "term-format" && termFormatCount === 0;
        }
      }

      function isExtraSpaceIssueType(type) {
        return type === "line-edge-extra-space" ||
          type === "cjk-extra-space" ||
          type === "cjk-punctuation-extra-space" ||
          type === "script-extra-space" ||
          type === "number-extra-space" ||
          type === "repeated-extra-space";
      }

      function getIssueKindLabel(type) {
        if (type === "term-format") return "术语格式";
        if (type === "line-edge-extra-space") return "行首尾空格";
        if (type === "cjk-extra-space") return "中文间空格";
        if (type === "cjk-punctuation-extra-space") return "中文标点旁空格";
        if (type === "script-extra-space") return "角标左右空格";
        if (type === "number-extra-space") return "数字间空格";
        if (type === "repeated-extra-space") return "连续多余空格";
        if (isExtraSpaceIssueType(type)) return "多余空格";
        return "缺少空格";
      }

      function groupIssuesByNode(items) {
        const groups = [];
        const groupMap = new Map();

        for (const issue of items) {
          let group = groupMap.get(issue.nodeId);
          if (!group) {
            group = {
              nodeId: issue.nodeId,
              nodeName: issue.nodeName,
              pageName: issue.pageName,
              issues: []
            };
            groupMap.set(issue.nodeId, group);
            groups.push(group);
          }
          group.issues.push(issue);
        }

        return groups;
      }

      function appendVisibleSpaces(container, value) {
        container.textContent = String(value || "");
      }

      function renderFixAllPreview(preview) {
        allPreviewSummary.innerHTML = "";

        if (!preview || !preview.valid) {
          allPreviewDescription.textContent = "当前没有可修复的问题。";
          confirmFixAllButton.disabled = true;
          openFixAllPreview();
          return;
        }

        confirmFixAllButton.disabled = false;
        allPreviewDescription.textContent = "确认后将按以下统计执行批量修复。";
        const breakdown = preview.breakdown || {};

        const total = document.createElement("div");
        total.className = "summary-total";
        const totalCopy = document.createElement("div");
        const totalEyebrow = document.createElement("div");
        totalEyebrow.className = "summary-eyebrow";
        totalEyebrow.textContent = "Total issues";
        const totalLabel = document.createElement("div");
        totalLabel.className = "summary-total-copy";
        totalLabel.textContent = "全部问题";
        const totalMeta = document.createElement("div");
        totalMeta.className = "summary-total-copy";
        totalMeta.textContent = `涉及 ${preview.nodeCount} 个文本图层`;
        totalCopy.append(totalEyebrow, totalLabel, totalMeta);
        const totalValue = document.createElement("strong");
        totalValue.className = "summary-total-value";
        totalValue.textContent = preview.issueCount;
        total.append(totalCopy, totalValue);
        allPreviewSummary.appendChild(total);

        const subgrid = document.createElement("div");
        subgrid.className = "summary-subgrid";
        const summaries = [
          {
            eyebrow: "Missing",
            label: "缺少空格",
            value: preview.missingSpaces,
            details: [
              [breakdown.missingCjkLatin || 0, "中文与英文"],
              [breakdown.missingCjkNumber || 0, "中文与普通数字"],
              [breakdown.missingScript || 0, "中文与数字角标"]
            ]
          },
          {
            eyebrow: "Extra",
            label: "多余空格",
            value: preview.extraSpaces,
            details: [
              [breakdown.extraLineEdges || 0, "行首、行尾"],
              [breakdown.extraCjk || 0, "中文之间"],
              [breakdown.extraCjkPunctuation || 0, "中文与标点"],
              [breakdown.extraScript || 0, "角标左右"],
              [breakdown.extraCjkLatin || 0, "中文与英文"],
              [breakdown.extraCjkNumber || 0, "中文与普通数字"],
              [breakdown.extraLatin || 0, "英文之间"],
              [breakdown.extraLatinNumber || 0, "英文与数字"],
              [breakdown.extraNumber || 0, "数字之间"]
            ],
            risk: removeExtraSpacesInput.checked && preview.extraSpaces > 0
              ? "可能删除刻意保留的排版空格，请确认。"
              : ""
          },
          {
            eyebrow: "Terms",
            label: "术语格式",
            value: preview.termFormatIssues,
            details: preview.termFormatIssues
              ? [[preview.termFormatIssues, "按术语规则校正"]]
              : []
          }
        ];

        for (const summary of summaries) {
          const item = document.createElement("div");
          item.className = "summary-item";
          const eyebrow = document.createElement("div");
          eyebrow.className = "summary-eyebrow";
          eyebrow.textContent = summary.eyebrow;
          const metric = document.createElement("div");
          metric.className = "summary-metric";
          const valueNode = document.createElement("span");
          valueNode.className = "summary-value";
          valueNode.textContent = summary.value;
          const labelNode = document.createElement("span");
          labelNode.className = "summary-label";
          labelNode.textContent = summary.label;
          metric.append(valueNode, labelNode);
          item.append(eyebrow, metric);

          const visibleDetails = summary.details.filter(([value]) => value > 0);
          if (visibleDetails.length) {
            const details = document.createElement("div");
            details.className = "summary-details";
            for (const [value, label] of visibleDetails) {
              const detail = document.createElement("div");
              detail.className = "summary-detail";
              const detailValue = document.createElement("span");
              detailValue.className = "summary-detail-value";
              detailValue.textContent = value;
              const detailLabel = document.createElement("span");
              detailLabel.className = "summary-detail-label";
              detailLabel.textContent = label;
              detail.append(detailValue, detailLabel);
              details.appendChild(detail);
            }
            item.appendChild(details);
          }

          if (summary.risk) {
            const risk = document.createElement("div");
            risk.className = "summary-risk";
            risk.textContent = summary.risk;
            item.appendChild(risk);
          }
          subgrid.appendChild(item);
        }

        allPreviewSummary.appendChild(subgrid);
        openFixAllPreview();
      }

      syncDependentSettings();
      updateScanAvailability();
    </script>
  </body>
</html>
