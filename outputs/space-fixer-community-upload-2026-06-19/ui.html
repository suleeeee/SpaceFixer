<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpaceFixer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--figma-color-bg);
        --fg: var(--figma-color-text);
        --muted: var(--figma-color-text-secondary);
        --border: var(--figma-color-border);
        --panel: var(--figma-color-bg-secondary);
        --brand: var(--figma-color-bg-brand);
        --brand-fg: var(--figma-color-text-onbrand);
        --danger: var(--figma-color-text-danger);
        --hover: var(--figma-color-bg-hover);
        --vivo-blue: #415fff;
        --success: #2cac76;
        --warning: #f2a133;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 12px/1.5 Helvetica, "Helvetica Neue", "Noto Sans SC", sans-serif;
      }

      body.modal-open {
        overflow: hidden;
      }

      button,
      textarea,
      input,
      select {
        font: inherit;
      }

      .app {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      header {
        padding: 16px 16px 12px;
        border-bottom: 1px solid var(--border);
      }

      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        line-height: 20px;
      }

      .brand-title {
        display: block;
        width: 74px;
        height: 14px;
        margin: 0 0 5px;
        color: var(--fg);
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      main {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        gap: 12px;
        padding: 12px 16px 16px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(112px, 1fr) auto auto;
        gap: 8px;
        align-items: center;
      }

      .scan-options {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 24px;
        color: var(--muted);
      }

      .scan-option-groups {
        display: grid;
        gap: 6px;
      }

      .scan-option-group {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 24px;
      }

      .scan-option-group .scan-options {
        min-width: 0;
        flex: 1;
      }

      .scan-option-heading {
        width: 58px;
        flex: 0 0 58px;
        color: var(--tertiary);
        font-size: 11px;
        line-height: 16px;
      }

      .scan-options label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 24px;
        cursor: pointer;
        line-height: 16px;
      }

      .scan-options input {
        width: 14px;
        height: 14px;
        align-self: center;
        margin: 0;
      }

      .scan-option-label {
        line-height: 16px;
        white-space: nowrap;
      }

      .optional-scan-option {
        color: var(--muted);
      }

      .settings-trigger {
        display: grid;
        width: 28px;
        height: 28px;
        flex: none;
        place-items: center;
        border-color: transparent;
        background: transparent;
        color: var(--muted);
        padding: 0;
      }

      .settings-trigger svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .settings-trigger:hover {
        border-color: transparent;
        background: var(--panel-hover);
        color: var(--fg);
      }

      .script-rule-note {
        color: var(--tertiary);
        font-size: 11px;
        line-height: 16px;
        padding: 0 2px;
      }

      .extra-space-warning {
        border-radius: 6px;
        color: var(--muted);
        font-size: 11px;
        line-height: 16px;
        padding: 6px 8px;
      }

      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--fg);
        outline: none;
      }

      select {
        height: 32px;
        appearance: none;
        padding: 0 38px 0 10px;
        background-image:
          linear-gradient(45deg, transparent 50%, currentColor 50%),
          linear-gradient(135deg, currentColor 50%, transparent 50%);
        background-position:
          calc(100% - 16px) 13px,
          calc(100% - 11px) 13px;
        background-repeat: no-repeat;
        background-size: 5px 5px, 5px 5px;
      }

      textarea {
        min-height: 116px;
        resize: vertical;
        padding: 8px;
        line-height: 14px;
      }

      button {
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--fg);
        cursor: pointer;
        padding: 0 10px;
        white-space: nowrap;
        transition:
          background-color 120ms ease,
          border-color 120ms ease,
          transform 80ms ease;
      }

      button:hover {
        background: var(--hover);
        border-color: var(--figma-color-border-strong);
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }

      button.primary {
        border-color: transparent;
        background: var(--brand);
        color: var(--brand-fg);
      }

      button.primary:hover {
        border-color: transparent;
        background: var(--figma-color-bg-brand-hover);
      }

      button.primary:active {
        background: var(--figma-color-bg-brand-pressed);
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 24px;
      }

      .section-title strong {
        font-size: 12px;
      }

      .count {
        color: var(--muted);
      }

      .results-section {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        gap: 8px;
      }

      .result-status {
        display: flex;
        min-height: 34px;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--panel);
        color: var(--muted);
        padding: 7px 10px;
      }

      .result-status.is-success {
        min-height: 20px;
        border-color: transparent;
        background: transparent;
        color: var(--success);
        font-size: 11px;
        padding: 0;
      }

      .result-status.is-warning {
        border-color: var(--warning);
        color: var(--warning);
      }

      .result-status.is-failure {
        border-color: var(--figma-color-border-danger);
        color: var(--danger);
      }

      .issue-filters {
        display: flex;
        gap: 6px;
        overflow-x: auto;
      }

      .issue-filter {
        height: 28px;
        border-radius: 14px;
        color: var(--muted);
        padding: 0 10px;
      }

      .issue-filter.is-selected {
        border-color: var(--brand);
        background: rgba(13, 153, 255, 0.14);
        color: var(--fg);
      }

      .issue-filter-rule {
        color: inherit;
        font-size: 9px;
      }

      .status-spinner {
        width: 12px;
        height: 12px;
        flex: none;
        border: 2px solid var(--border);
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: spin 720ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .issues {
        display: flex;
        min-height: 180px;
        flex: 1;
        flex-direction: column;
        gap: 8px;
        overflow: auto;
        padding-right: 2px;
        transition: opacity 120ms ease;
      }

      .extra-space-warning:not([hidden]) + .results-section .issues {
        min-height: 96px;
      }

      .issues.is-stale {
        opacity: 0.58;
      }

      .issue {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      .issue-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 34px;
        border-bottom: 1px solid var(--border);
        padding: 7px 10px;
      }

      .node {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 4px;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        font-weight: 600;
      }

      .node-page,
      .node-separator {
        flex: none;
        color: #7f7a7a;
        font-weight: 400;
      }

      .node-layer {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .group-count {
        flex: none;
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
        white-space: nowrap;
      }

      .issue-row {
        display: flex;
        min-height: 48px;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
      }

      .issue-row + .issue-row {
        border-top: 1px solid var(--border);
      }

      .issue-row:hover {
        background: var(--hover);
      }

      .issue-copy {
        min-width: 0;
        flex: 1;
      }

      .issue-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 2px;
      }

      .issue-kind {
        color: var(--muted);
        font-size: 11px;
      }

      .pair {
        color: var(--fg);
        font-weight: 600;
        white-space: pre;
        word-break: keep-all;
      }

      .difference-arrow {
        color: var(--muted);
        font-weight: 400;
      }

      .difference-after {
        color: var(--vivo-blue);
      }

      .excerpt {
        overflow: hidden;
        color: var(--fg);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .issue-actions {
        display: flex;
        flex: none;
        gap: 6px;
      }

      .issue-actions button {
        height: 28px;
        padding: 0 9px;
      }

      .issue-action-locate {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }

      .issue-action-term {
        border-color: transparent;
        background: transparent;
        color: var(--tertiary);
      }

      .issue-action-term:hover {
        border-color: transparent;
        background: var(--panel-secondary);
        color: var(--muted);
      }

      .issue-ignore-editor {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        align-items: center;
        border-top: 1px solid var(--border);
        background: var(--panel-secondary);
        padding: 8px 10px;
      }

      .issue-ignore-input {
        width: 100%;
        min-width: 0;
        height: 30px;
      }

      .issue-ignore-save,
      .issue-ignore-cancel {
        height: 30px;
        padding: 0 10px;
      }

      .issue-ignore-cancel {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }

      .issue-action-fix {
        border-color: var(--brand);
        color: var(--brand);
      }

      .preview-note {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
      }

      .preview-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .danger {
        border-color: var(--figma-color-border-danger, #e03e3e);
        background: var(--figma-color-bg-danger, #e03e3e);
        color: var(--figma-color-text-onbrand, #ffffff);
      }

      .danger:hover {
        border-color: var(--figma-color-border-danger-strong, #f05a5a);
        background: var(--figma-color-bg-danger-hover, #c93434);
      }

      .modal-backdrop {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.56);
        overscroll-behavior: contain;
        padding: 16px;
      }

      .modal {
        display: flex;
        width: 100%;
        max-width: 388px;
        max-height: calc(100vh - 32px);
        min-width: 0;
        flex-direction: column;
        flex-shrink: 0;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg, #2c2c2c);
        overflow: hidden;
        overscroll-behavior: contain;
        padding: 14px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
      }

      #allPreviewOverlay {
        align-items: center;
        overflow: hidden;
      }

      .preview-modal {
        max-height: calc(100vh - 32px);
        overflow-y: auto;
      }

      .preview-modal > h2,
      .preview-modal > p,
      .preview-modal > .summary-grid,
      .preview-modal > .preview-actions {
        flex: none;
      }

      .modal h2 {
        margin: 0;
        font-size: 14px;
      }

      .confirm-description {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .settings-modal {
        max-width: 360px;
      }

      .settings-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .settings-sections {
        display: grid;
        max-height: calc(100vh - 122px);
        min-height: 0;
        align-content: start;
        grid-auto-rows: max-content;
        gap: 8px;
        overflow-y: auto;
        padding-right: 2px;
      }

      .settings-section {
        display: grid;
        gap: 6px;
        align-content: start;
        border-radius: 12px;
        background: var(--panel-secondary);
        padding: 10px 12px;
      }

      .settings-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 4px;
      }

      .settings-section-head strong {
        font-size: 12px;
        line-height: 16px;
      }

      .settings-reset {
        min-height: 24px;
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--brand);
        font-size: 11px;
        box-shadow: none;
      }

      .settings-reset:hover:not(:disabled) {
        background: transparent;
        color: var(--brand-hover);
      }

      .settings-divider {
        height: 1px;
        margin: 4px 2px;
        background: var(--border);
      }

      .settings-note {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 14px;
      }

      .settings-note strong {
        color: var(--text);
        font-weight: 600;
      }

      .settings-options-inline {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 16px;
      }

      .settings-option {
        display: flex;
        min-height: 24px;
        align-items: center;
        gap: 7px;
        color: var(--fg);
        cursor: pointer;
      }

      .settings-option input {
        width: 15px;
        height: 15px;
        flex: none;
        margin: 0;
        accent-color: var(--brand);
      }

      .settings-option span {
        line-height: 16px;
      }

      .settings-option.is-disabled {
        cursor: default;
        opacity: 0.45;
      }

      .summary-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .summary-total {
        position: relative;
        display: flex;
        min-height: 104px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background:
          linear-gradient(135deg, var(--panel-hover), var(--panel-secondary));
        overflow: hidden;
        padding: 16px 18px;
      }

      .summary-total::after {
        position: absolute;
        width: 96px;
        height: 96px;
        border: 1px solid var(--border);
        border-radius: 50%;
        content: "";
        opacity: 0.55;
        right: -38px;
        top: -46px;
      }

      .summary-total-copy {
        color: var(--muted);
        font-size: 11px;
        line-height: 16px;
      }

      .summary-eyebrow {
        color: var(--tertiary);
        font-family:
          "SF Pro Display",
          "Helvetica Neue",
          "Avenir Next",
          sans-serif;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.12em;
        line-height: 12px;
        text-transform: uppercase;
      }

      .summary-total-value {
        position: relative;
        z-index: 1;
        color: var(--fg);
        font-family:
          "SF Pro Display",
          "Helvetica Neue",
          "Avenir Next",
          sans-serif;
        font-feature-settings: "tnum" 1, "ss01" 1;
        font-size: 44px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        letter-spacing: -0.055em;
        line-height: 1;
      }

      .summary-subgrid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      .summary-item {
        display: flex;
        min-width: 0;
        min-height: 126px;
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel-secondary);
        color: var(--muted);
        padding: 11px;
        text-align: left;
      }

      .summary-metric {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-top: 2px;
      }

      .summary-value {
        display: block;
        color: var(--fg);
        font-family:
          "SF Pro Display",
          "Helvetica Neue",
          "Avenir Next",
          sans-serif;
        font-feature-settings: "tnum" 1, "ss01" 1;
        font-size: 28px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .summary-label {
        color: inherit;
        font-size: 11px;
        line-height: 15px;
      }

      .summary-details {
        display: flex;
        width: 100%;
        flex-direction: column;
        gap: 3px;
        margin-top: 7px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 9px;
        line-height: 12px;
        padding-top: 7px;
      }

      .summary-detail {
        display: grid;
        min-width: 0;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: baseline;
        gap: 4px;
      }

      .summary-detail-value {
        color: var(--fg);
        font-family:
          "SF Pro Display",
          "Helvetica Neue",
          "Avenir Next",
          sans-serif;
        font-feature-settings: "tnum" 1;
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }

      .summary-detail-label {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .summary-risk {
        margin-top: auto;
        border-radius: 6px;
        background: var(--warning-soft);
        color: var(--warning);
        font-size: 9px;
        line-height: 13px;
        padding: 5px 6px;
      }

      [hidden] {
        display: none !important;
      }

      .empty {
        display: grid;
        min-height: 180px;
        place-items: center;
        border: 1px dashed var(--border);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
        padding: 20px;
      }

      .whitelist-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }

      #clearWhitelist {
        margin-left: auto;
      }

      .whitelist-toolbar {
        position: relative;
        display: block;
      }

      .whitelist-toolbar select {
        width: 100%;
        height: 34px;
        min-height: 34px;
        padding-right: 190px;
        line-height: 20px;
        background-position:
          calc(100% - 16px) 14px,
          calc(100% - 11px) 14px;
      }

      .whitelist-scope-hint {
        position: absolute;
        top: 50%;
        right: 38px;
        max-width: 180px;
        pointer-events: none;
        transform: translateY(-50%);
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        line-height: 16px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #saveStatus {
        overflow: hidden;
        min-width: 0;
        font-size: 12px;
        line-height: 18px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .whitelist-section {
        display: flex;
        flex: none;
        flex-direction: column;
        gap: 8px;
      }

      .whitelist-toggle {
        display: flex;
        width: 100%;
        height: 34px;
        align-items: center;
        justify-content: space-between;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        padding: 0;
        line-height: 16px;
        outline: none;
        text-align: left;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        transition: none;
      }

      .whitelist-toggle:hover {
        background: transparent;
      }

      .whitelist-toggle:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }

      .whitelist-toggle-copy {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        pointer-events: none;
      }

      .whitelist-toggle-copy strong {
        line-height: 16px;
      }

      .whitelist-summary {
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        line-height: 16px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .whitelist-chevron {
        position: relative;
        width: 24px;
        height: 24px;
        flex: none;
        border-radius: 4px;
        pointer-events: none;
      }

      .whitelist-chevron svg {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 14px;
        height: 14px;
        display: block;
        stroke: var(--tertiary);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        transform: translateZ(0);
      }

      .whitelist-toggle[aria-expanded="false"]:hover .whitelist-chevron {
        background: var(--panel-secondary);
      }

      .whitelist-toggle[aria-expanded="true"] .whitelist-chevron svg {
        transform: rotate(180deg);
      }

      .whitelist-content {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .save-status {
        color: var(--muted);
      }

      button:disabled,
      textarea:disabled,
      select:disabled {
        cursor: default;
        opacity: 0.48;
      }

      button:disabled:hover {
        background: var(--panel);
        border-color: var(--border);
      }

      /*
       * Apple-inspired interface system:
       * neutral surfaces, restrained semantic color, and depth through spacing.
       */
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --tertiary: #8e8e93;
        --border: rgba(60, 60, 67, 0.18);
        --border-strong: rgba(60, 60, 67, 0.3);
        --panel: #ffffff;
        --panel-secondary: rgba(118, 118, 128, 0.08);
        --panel-hover: rgba(118, 118, 128, 0.12);
        --brand: #0071e3;
        --brand-hover: #0077ed;
        --brand-pressed: #0068d1;
        --brand-soft: rgba(0, 113, 227, 0.1);
        --brand-fg: #ffffff;
        --danger: #ff3b30;
        --danger-soft: rgba(255, 59, 48, 0.1);
        --success: #248a3d;
        --success-soft: rgba(52, 199, 89, 0.1);
        --warning: #b25000;
        --warning-soft: rgba(255, 159, 10, 0.12);
        --hover: var(--panel-hover);
        --vivo-blue: var(--brand);
        --control-radius: 9px;
        --card-radius: 12px;
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-modal:
          0 24px 80px rgba(0, 0, 0, 0.2),
          0 4px 18px rgba(0, 0, 0, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --fg: #f5f5f7;
          --muted: #aeaeb2;
          --tertiary: #8e8e93;
          --border: rgba(84, 84, 88, 0.52);
          --border-strong: rgba(99, 99, 102, 0.72);
          --panel: #2c2c2e;
          --panel-secondary: rgba(118, 118, 128, 0.16);
          --panel-hover: rgba(118, 118, 128, 0.24);
          --brand: #0071e3;
          --brand-hover: #147ce5;
          --brand-pressed: #0068d1;
          --brand-soft: rgba(0, 113, 227, 0.14);
          --danger: #ff453a;
          --danger-soft: rgba(255, 69, 58, 0.16);
          --success: #30d158;
          --success-soft: rgba(48, 209, 88, 0.13);
          --warning: #ffd60a;
          --warning-soft: rgba(255, 214, 10, 0.12);
          --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.18);
          --shadow-modal:
            0 30px 90px rgba(0, 0, 0, 0.56),
            0 4px 20px rgba(0, 0, 0, 0.28);
        }
      }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          Helvetica,
          "Helvetica Neue",
          "Noto Sans SC",
          sans-serif;
        font-size: 12px;
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
      }

      header {
        padding: 18px 18px 15px;
        border-bottom-color: var(--border);
        background: var(--bg);
      }

      h1 {
        margin-bottom: 3px;
        font-size: 15px;
        line-height: 20px;
      }

      .brand-title {
        width: 74px;
        height: 14px;
        margin-bottom: 5px;
      }

      header p {
        font-size: 11px;
        line-height: 17px;
      }

      main {
        gap: 10px;
        padding: 12px 18px 14px;
      }

      .toolbar {
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
      }

      select,
      textarea,
      button {
        border-color: var(--border);
        border-radius: var(--control-radius);
        background: var(--panel);
        color: var(--fg);
        box-shadow: var(--shadow-card);
      }

      select {
        height: 34px;
        padding-left: 12px;
        background-color: var(--panel);
        background-image:
          linear-gradient(45deg, transparent 50%, var(--tertiary) 50%),
          linear-gradient(135deg, var(--tertiary) 50%, transparent 50%);
        background-position:
          calc(100% - 16px) 14px,
          calc(100% - 11px) 14px;
        background-repeat: no-repeat;
        background-size: 5px 5px, 5px 5px;
      }

      textarea {
        min-height: 120px;
        padding: 10px 11px;
        line-height: 19px;
      }

      button {
        height: 34px;
        padding: 0 12px;
        font-weight: 500;
        transition:
          background-color 140ms ease,
          border-color 140ms ease,
          color 140ms ease,
          opacity 140ms ease,
          transform 80ms ease;
      }

      button:hover {
        border-color: var(--border-strong);
        background: var(--panel-hover);
      }

      button.primary {
        background: var(--brand);
        color: var(--brand-fg);
        box-shadow: none;
      }

      button.primary:hover {
        background: var(--brand-hover);
      }

      button.primary:active {
        background: var(--brand-pressed);
      }

      button:focus-visible,
      .whitelist-toggle:focus-visible {
        outline: 3px solid var(--brand-soft);
        outline-offset: 1px;
      }

      button:disabled,
      textarea:disabled,
      select:disabled {
        opacity: 0.4;
      }

      .scan-options {
        min-height: 22px;
        gap: 18px;
        color: var(--muted);
      }

      .scan-options label {
        min-height: 22px;
        gap: 5px;
      }

      .scan-options input {
        width: 15px;
        height: 15px;
        accent-color: var(--brand);
      }

      .optional-scan-option {
        color: inherit;
        font-size: inherit;
      }

      .extra-space-warning {
        margin-top: -5px;
        border: 1px solid transparent;
        border-radius: var(--control-radius);
        background: var(--warning-soft);
        color: var(--warning);
        font-size: 10px;
        line-height: 14px;
        padding: 8px 11px;
      }

      .section-title {
        min-height: 22px;
      }

      .section-title strong {
        font-size: 12px;
        letter-spacing: -0.01em;
      }

      .count {
        color: var(--tertiary);
      }

      .results-section {
        gap: 7px;
      }

      .result-status {
        min-height: 36px;
        border-color: transparent;
        border-radius: var(--control-radius);
        background: var(--panel-secondary);
        color: var(--muted);
        padding: 8px 11px;
        box-shadow: none;
      }

      .result-status.is-success {
        min-height: 30px;
        border-radius: var(--control-radius);
        background: var(--success-soft);
        color: var(--success);
        padding: 6px 10px;
      }

      .result-status.is-warning {
        border-color: transparent;
        background: var(--warning-soft);
        color: var(--warning);
      }

      .result-status.is-failure {
        border-color: transparent;
        background: var(--danger-soft);
        color: var(--danger);
      }

      .issue-filters {
        gap: 5px;
        padding: 1px 0;
      }

      .issue-filter {
        height: 28px;
        border-color: transparent;
        border-radius: 14px;
        background: var(--panel-secondary);
        color: var(--muted);
        box-shadow: none;
        padding: 0 11px;
      }

      .issue-filter:hover {
        border-color: transparent;
        background: var(--panel-hover);
      }

      .issue-filter.is-selected {
        border-color: transparent;
        background: var(--panel-hover);
        color: var(--brand);
      }

      .issues {
        gap: 9px;
        scrollbar-color: var(--border-strong) transparent;
        scrollbar-width: thin;
      }

      .issues::-webkit-scrollbar {
        width: 5px;
      }

      .issues::-webkit-scrollbar-thumb {
        border-radius: 5px;
        background: var(--border-strong);
      }

      .issue {
        border-color: var(--border);
        border-radius: var(--card-radius);
        background: var(--panel);
        box-shadow: var(--shadow-card);
      }

      .issue-head {
        min-height: 36px;
        border-bottom-color: var(--border);
        padding: 8px 11px;
      }

      .node-page,
      .node-separator,
      .preview-page,
      .preview-separator {
        color: var(--tertiary);
      }

      .issue-row {
        min-height: 52px;
        gap: 9px;
        padding: 8px 11px;
      }

      .issue-row + .issue-row {
        border-top-color: var(--border);
      }

      .issue-row:hover {
        background: var(--panel-secondary);
      }

      .issue-meta {
        gap: 7px;
        margin-bottom: 3px;
      }

      .issue-kind {
        color: var(--tertiary);
      }

      .difference-after {
        color: var(--brand);
      }

      .issue-actions {
        gap: 5px;
      }

      .issue-actions button {
        height: 30px;
        border-radius: 8px;
        padding: 0 10px;
        box-shadow: none;
      }

      .issue-action-locate {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }

      .issue-action-locate:hover {
        border-color: transparent;
        background: var(--panel-secondary);
      }

      .issue-action-fix {
        border-color: transparent;
        background: var(--panel-secondary);
        color: var(--brand);
      }

      .issue-action-fix:hover {
        border-color: transparent;
        background: var(--brand);
        color: var(--brand-fg);
      }

      .empty {
        min-height: 168px;
        border: 0;
        border-radius: var(--card-radius);
        background: var(--panel-secondary);
        color: var(--muted);
      }

      .whitelist-section {
        gap: 9px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }

      .whitelist-toggle {
        height: 36px;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .whitelist-toggle[aria-expanded="false"]:hover {
        background: transparent;
      }

      .whitelist-toggle[aria-expanded="true"],
      .whitelist-toggle[aria-expanded="true"]:hover {
        background: transparent;
      }

      .whitelist-toggle-copy {
        gap: 7px;
      }

      .whitelist-summary {
        color: var(--tertiary);
      }

      .whitelist-chevron {
        border-radius: 7px;
      }

      .whitelist-content {
        gap: 13px;
      }

      .modal-backdrop {
        background: rgba(0, 0, 0, 0.58);
        padding: 16px;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }

      .modal {
        gap: 14px;
        border-color: var(--border);
        border-radius: 16px;
        background: var(--panel);
        padding: 16px;
        box-shadow: var(--shadow-modal);
      }

      .modal h2 {
        font-size: 15px;
        letter-spacing: -0.02em;
      }

      .confirm-description {
        line-height: 1.55;
      }

      .summary-grid {
        gap: 8px;
      }

      .summary-item {
        border-color: var(--border);
        border-radius: 12px;
        background: var(--panel-secondary);
        box-shadow: none;
        padding: 11px;
      }

      .summary-value {
        font-size: 28px;
        line-height: 1;
      }

      .summary-label {
        line-height: 15px;
      }

      .summary-total {
        background:
          linear-gradient(135deg, var(--panel-hover), var(--panel-secondary));
      }

      .preview-actions {
        gap: 7px;
      }

      #allPreviewOverlay {
        background: rgba(0, 0, 0, 0.72);
      }

      .preview-modal {
        width: min(100%, 360px);
        border-color: var(--border);
        background: var(--bg);
      }

      .preview-modal .summary-total {
        background: var(--panel-hover);
      }

      .preview-modal .summary-item {
        background: var(--panel);
      }

      @media (prefers-color-scheme: dark) {
        .preview-modal {
          border-color: rgba(84, 84, 88, 0.72);
          background: #1c1c1e;
        }

        .preview-modal .summary-total {
          border-color: rgba(99, 99, 102, 0.72);
          background: #48484a;
        }

        .preview-modal .summary-item {
          border-color: rgba(84, 84, 88, 0.52);
          background: #2c2c2e;
        }
      }

      .danger {
        border-color: transparent;
        background: var(--danger);
        color: #ffffff;
        box-shadow: none;
      }

      .danger:hover {
        border-color: transparent;
        background: #e9342b;
      }
    </style>
  </head>
